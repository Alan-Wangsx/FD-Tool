<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>前台快捷工具 By Alan</title>
<style>
    :root { --primary: #4a90e2; --hover: #3a7bc8; --bg: #f5f5f5; --txt: #333; --txt-sec: #666; --err: #e74c3c; --msg-user: #e3f2fd; --msg-ai: #e8f4f8; --msg-ai-adv: #e8f4f8; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    body { background-color: var(--bg); display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 25px; }
    
    .container { background: white; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); padding: 30px; width: 100%; max-width: 1450px; display: flex; gap: 30px; flex-wrap: wrap; }
    
    .panel-left, .panel-mid, .panel-right { display: flex; flex-direction: column; }
    .panel-left { flex: 1.1; min-width: 320px; }
    .panel-mid { flex: 1; min-width: 300px; }
    .panel-right { flex: 1.4; min-width: 380px; }
    
    h1 { color: var(--txt); text-align: center; margin-bottom: 25px; font-weight: 600; display: flex; justify-content: center; align-items: baseline; gap: 8px; width: 100%; }
    .title-main { font-size: 28px; }
    .title-by { font-size: 18px; color: var(--txt-sec); font-weight: 500; }
    
    .section-title { font-size: 22px; color: var(--primary); margin: 0 0 15px; padding-bottom: 8px; border-bottom: 2px solid #eaeaea; }
    
    .input-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; color: #555; font-weight: 500; font-size: 15px; }
    .date-input-container { position: relative; display: flex; }
    .date-input-container input[type="text"] { flex: 1; padding-right: 50px; }
    .date-input-container input[type="date"] { position: absolute; right: 0; width: 50px; height: 100%; opacity: 0; cursor: pointer; z-index: 2; }
    .date-input-container::after { content: " 📅 "; position: absolute; right: 15px; top: 50%; transform: translateY(-50%); pointer-events: none; font-size: 18px; z-index: 1; }
    
    input { width: 100%; padding: 12px 15px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; transition: 0.3s; }
    input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.2); }
    
    .result-group { margin-top: 20px; background: #f9f9f9; padding: 20px; border-radius: 8px; border-left: 4px solid var(--primary); }
    .result-label { font-weight: 500; color: #555; margin-bottom: 10px; font-size: 15px;}
    .result { font-size: 22px; color: var(--txt); font-weight: 600; }
    .result-details, .date-hint, .error, .manual-label { font-size: 14px; color: var(--txt-sec); }
    .error { color: var(--err); display: none; margin-top: 5px; }
    
    button { cursor: pointer; border: none; border-radius: 6px; transition: 0.2s; font-size: 16px; }
    .calculate-btn, .search-btn { background: var(--primary); color: white; padding: 12px 20px; width: 100%; margin-top: 10px; }
    .calculate-btn:hover, .search-btn:hover { background: var(--hover); }
    
    .quick-days { display: flex; gap: 8px; margin-bottom: 15px; }
    .quick-day-btn { flex: 1; background: #7bb0ee; color: white; padding: 12px 5px; font-weight: 600; }
    .quick-day-btn:hover { background: #6ba0de; }
    .quick-day-btn.active { background: #5b90ce; box-shadow: 0 0 0 2px rgba(91, 144, 206, 0.3); }
    
    .manual-input-container { margin-top: 10px; }
    .manual-input, .country-search-container { display: flex; gap: 10px; }
    .manual-input input, .country-search-container input { flex: 1; }
    .manual-input button, .country-search-container button, .today-btn { flex: 0 0 auto; background: #f0f0f0; color: #333; }
    .country-search-container button { background: #7bb0ee; color: white; padding: 0 20px; }
    .country-search-container button:hover { background: #6ba0de; }
    .manual-input button { padding: 0 20px; }
    
    .date-action-btns { display: flex; gap: 8px; margin-top: 10px; }
    .today-btn { padding: 8px 12px; font-size: 13px; font-weight: 500; }
    .manual-input button:hover, .today-btn:hover { background: #e0e0e0; }

    /* ================== 免签查询卡片与列表样式 ================== */
    .country-results { margin-top: 15px; flex: 1; max-height: 480px; overflow-y: auto; border: 1px solid #eaeaea; border-radius: 6px; padding: 12px; background: #fff; }
    .country-results-header { font-size: 14px; color: var(--txt-sec); margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #f0f0f0; text-align: center; }
    .country-item { padding: 12px 10px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: background 0.2s; }
    .country-item:hover { background: #f9f9f9; }
    .country-item:last-child { border-bottom: none; }
    .country-name { font-weight: 500; font-size: 15px; }
    .country-code { color: var(--primary); background: #f0f7ff; padding: 4px 8px; border-radius: 4px; font-weight: 600; border: 1px solid #c5d9f1; font-size: 15px; }

    /* 卡片详情样式 */
    .detail-card { background: #fff; }
    .detail-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px dashed #eee; }
    .detail-title { font-size: 18px; font-weight: bold; color: #333; display: flex; align-items: center; }
    .btn-back { font-size: 13px; color: #666; background: #f0f0f0; padding: 6px 14px; border-radius: 20px; cursor: pointer; }
    .btn-back:hover { background: #e0e0e0; }

    .policy-group { margin-bottom: 15px; }
    .mt-small { margin-top: 25px; }
    .bubble-row { display: flex; align-items: center; margin-bottom: 8px; }
    .bubble-tag { padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; }
    .bubble-tag.primary { background: #4a90e2; color: white; }
    .bubble-tag.secondary { background: #fff; border: 1px solid #ccc; color: #666; font-weight: normal; }
    .colon { margin: 0 10px; font-weight: bold; font-size: 15px; color: #333; }
    .bubble-status { display: flex; align-items: center; justify-content: center; padding: 2px 16px; border-radius: 20px; font-weight: bold; font-size: 14px; }
    .bubble-status.is-free { background: #e8f5e9; border: 1px solid #c8e6c9; color: #07c160; }
    .bubble-status.no-free { background: #ffebee; border: 1px solid #ffcdd2; color: #fa5151; }
    .policy-desc { font-size: 14px; color: #333; line-height: 1.6; padding-left: 2px; }
    .text-gray { color: #666; }

    .source-group { margin-top: 25px; }
    .source-toggle { text-align: center; padding: 10px; background: #f9f9f9; border-radius: 6px; font-size: 13px; color: #666; border: 1px dashed #ccc; font-weight: 500; cursor: pointer; }
    .source-toggle:hover { background: #f0f0f0; }
    .source-content { margin-top: 10px; }
    .url-card { display: flex; justify-content: space-between; align-items: center; background: #fff; border: 1px solid #eee; padding: 10px; border-radius: 6px; margin-bottom: 8px; }
    .url-txt { font-size: 12px; color: #888; flex: 1; margin-right: 15px; word-break: break-all; }
    .copy-btn { background: #f0f7ff; color: #4a90e2; border: 1px solid #4a90e2; font-size: 12px; padding: 4px 10px; border-radius: 4px; font-weight: bold; white-space: nowrap; cursor: pointer; }
    .copy-btn:hover { background: #4a90e2; color: white; }
    
    /* ================= AI 对话框样式 ================= */
    .ai-container { display: flex; flex-direction: column; flex: 1; border: 1px solid #eaeaea; border-radius: 8px; overflow: hidden; }
    .ai-tabs { display: flex; background: #f0f0f0; border-bottom: 1px solid #ddd; }
    .ai-tab { flex: 1; text-align: center; padding: 14px; cursor: pointer; font-weight: 600; color: #666; transition: 0.3s; font-size: 15px; }
    .ai-tab.active { background: white; color: var(--primary); border-bottom: 3px solid var(--primary); }
    .ai-tab:hover:not(.active) { background: #e8e8e8; }
    
    .chat-window { flex: 1; padding: 20px; overflow-y: auto; background: #fafafa; min-height: 400px; display: flex; flex-direction: column; gap: 15px; }
    
    .msg-row { display: flex; width: 100%; }
    .msg-row.user { justify-content: flex-end; }
    .msg-row.ai { justify-content: flex-start; }
    .msg-bubble { max-width: 90%; padding: 12px 16px; border-radius: 8px; font-size: 15px; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word; }
    .msg-row.user .msg-bubble { background: var(--msg-user); color: #0d47a1; border-bottom-right-radius: 2px; }
    .msg-row.ai .msg-bubble { background: var(--msg-ai); color: #333; border-bottom-left-radius: 2px; }
    
    .msg-row.ai-adv { justify-content: flex-start; margin-top: -5px; }
    .msg-row.ai-adv .msg-bubble { background: var(--msg-ai-adv); border-left: 4px solid #82b1ff; font-size: 14px; border-top-left-radius: 2px; border-bottom-left-radius: 2px; }

    /* ================= 加载动画 ================= */
    .msg-bubble.loading-bubble {
        padding: 0 !important;
        width: 58px !important;
        height: 42px !important;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .typing-indicator {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
    }

    .typing-indicator span {
        width: 4px;
        height: 4px;
        background-color: #d1d5db;
        border-radius: 50%;
        animation: typingBounce 1.4s infinite ease-in-out both;
    }

    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0s; }

    @keyframes typingBounce {
        0%, 80%, 100% {
            transform: translateY(0);
            background-color: #d1d5db;
        }
        40% {
            transform: translateY(-4px);
            background-color: #6b7280;
        }
    }
    
    .ai-input-area { padding: 15px; background: white; border-top: 1px solid #eaeaea; display: flex; gap: 10px; }
    .ai-input-area input { flex: 1; padding: 12px 15px; font-size: 15px; }
    .ai-input-area button { padding: 0 25px; background: var(--primary); color: white; font-weight: 600; font-size: 16px; }
    .ai-input-area button:hover { background: var(--hover); }
    .ai-input-area button:disabled { background: #ccc; cursor: not-allowed; }

    .footer { text-align: center; width: 100%; margin-top: 20px; color: #777; font-size: 14px; border-top: 1px solid #eee; padding-top: 15px; }
    .copyright { font-weight: 500; color: #555; }

    .copied-success { background: #4caf50 !important; color: white !important; }
</style>
</head>
<body>
<div class="container">
    <h1><span class="title-main">前台快捷工具</span><span class="title-by">By Alan</span></h1>
    
    <!-- 第1栏：文本与日期处理 -->
    <div class="panel-left">
        <div class="section-title">转首字母大写</div>
        <div class="input-group" style="margin-bottom: 25px;">
            <div class="manual-input">
                <input type="text" id="nameCaseInput" placeholder="输入全大写名字，如：DOMINGUES">
                <button id="convertCaseBtn" style="background: #7bb0ee; color: white;">转换并复制</button>
            </div>
            <div class="result" id="nameCaseResult" style="font-size: 18px; color: var(--primary); display: none; margin-top: 12px; padding: 10px; background: #f0f7ff; border-radius: 6px; border: 1px solid #c5d9f1;"></div>
        </div>

        <div class="section-title">入境有效期计算</div>
        <div class="input-group">
            <label for="startDate">入境日期</label>
            <div class="date-input-container">
                <input type="text" id="startDate" placeholder="如：2026/07/15">
                <input type="date" id="startDatePicker">
            </div>
            <div class="date-action-btns">
                <button class="today-btn" id="todayBtn">设为今天</button>
                <button class="today-btn" id="nextDayBtn">日期 +1</button>
                <button class="today-btn" id="prevDayBtn">日期 -1</button>
            </div>
            <div class="error" id="dateError">请输入有效的日期</div>
        </div>
        
        <div class="input-group">
            <label for="daysToAdd">停留天数</label>
            <div class="quick-days">
                <button class="quick-day-btn" data-days="30">30天</button>
                <button class="quick-day-btn" data-days="60">60天</button>
                <button class="quick-day-btn" data-days="90">90天</button>
                <button class="quick-day-btn" data-days="120">120天</button>
                <button class="quick-day-btn" data-days="180">180天</button>
            </div>
            <div class="manual-input-container">
                <span class="manual-label">手动输入</span>
                <div class="manual-input">
                    <input type="number" id="daysToAdd" min="1" placeholder="其他天数">
                    <button id="manualCalculateBtn">计算</button>
                </div>
            </div>
            <div class="error" id="daysError">请输入有效的天数（≥1）</div>
        </div>
        
        <div class="result-group">
            <div class="result-label">计算结果</div>
            <div class="result" id="result">请输入入境日期和停留天数</div>
            <div class="result-details" id="resultDetails"></div>
        </div>
    </div>

    <!-- 第2栏：全球免签入境中国政策查询 (新版升级) -->
    <div class="panel-mid">
        <div class="section-title">全球免签入境中国政策查询</div>
        <div class="country-search-container">
            <input type="text" id="countrySearch" placeholder="输入国家名称或代码模糊搜索">
            <button id="searchBtn">查找</button>
        </div>
        <div class="country-results" id="countryResults">
            <div class="country-results-header">请输入国家名称或代码进行搜索</div>
        </div>
    </div>

    <!-- 第3栏：AI 英语助理 -->
    <div class="panel-right">
        <div class="section-title">英语助理</div>
        <div class="ai-container">
            <div class="ai-tabs">
                <div class="ai-tab active" data-action="pronunciation">发音辅助</div>
                <div class="ai-tab" data-action="short_translation">短语翻译</div>
                <div class="ai-tab" data-action="long_translation">长文翻译</div>
            </div>

            <div class="chat-window" id="chatWindow"></div>
            
            <div class="ai-input-area">
                <input type="text" id="aiInput" placeholder="输入外宾姓名，例如：Schmidt">
                <button id="aiSendBtn">发送</button>
            </div>
        </div>
    </div>
    
    <div class="footer">
        <div class="copyright">上海和平饭店©️2026</div>
    </div>
</div>

<script>
// ==================== 全局配置 ====================
const API_URL = "https://api.alanwangsx.xyz";
// =================================================

document.addEventListener('DOMContentLoaded', () => {
    const $ = id => document.getElementById(id);
    
    // ======== 转首字母大写逻辑 ========
    const nameCaseInput = $('nameCaseInput');
    const convertCaseBtn = $('convertCaseBtn');
    const nameCaseResult = $('nameCaseResult');

    const convertNameCase = () => {
        const text = nameCaseInput.value.trim();
        if (!text) return;
        
        const converted = text.toLowerCase().replace(/(?:^|[\s-])\w/g, function(match) {
            return match.toUpperCase();
        });
        
        nameCaseResult.innerText = converted;
        nameCaseResult.style.display = 'block';

        navigator.clipboard.writeText(converted).then(() => {
            const originalText = convertCaseBtn.innerText;
            convertCaseBtn.innerText = "已复制！";
            convertCaseBtn.classList.add('copied-success');
            
            setTimeout(() => {
                convertCaseBtn.innerText = originalText;
                convertCaseBtn.classList.remove('copied-success');
            }, 2000);
        }).catch(err => {
            console.error('复制失败', err);
            convertCaseBtn.innerText = "复制失败，请手动复制";
            setTimeout(() => { convertCaseBtn.innerText = "转换并复制"; }, 2000);
        });
    };

    convertCaseBtn.addEventListener('click', convertNameCase);
    nameCaseInput.addEventListener('keypress', e => e.key === 'Enter' && convertNameCase());

    // ======== 日期计算逻辑 ========
    const els = {
        sDate: $('startDate'), sPicker: $('startDatePicker'), days: $('daysToAdd'),
        calcBtn: $('manualCalculateBtn'), res: $('result'), resDet: $('resultDetails'),
        dErr: $('dateError'), dayErr: $('daysError'), today: $('todayBtn'),
        prevDayBtn: $('prevDayBtn'), nextDayBtn: $('nextDayBtn'), 
        search: $('countrySearch'), sBtn: $('searchBtn'),
        cRes: $('countryResults'), qBtns: document.querySelectorAll('.quick-day-btn')
    };

    const fmt = (d, type = '/') => {
        const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), da = String(d.getDate()).padStart(2,'0');
        return type === '/' ? `${y}/${m}/${da}` : `${y}-${m}-${da}`;
    };
    const parse = (str) => {
        if(!str) return null;
        const clean = str.replace(/[年月日-]/g, '/');
        const d = new Date(clean);
        return isNaN(d.getTime()) ? null : d;
    };
    const clearQuick = () => els.qBtns.forEach(b => b.classList.remove('active'));
    
    const calc = () => {
        els.dErr.style.display = els.dayErr.style.display = 'none';
        const d = parse(els.sDate.value);
        const days = parseInt(els.days.value);
        if (!d) return els.dErr.style.display = 'block';
        if (isNaN(days) || days < 1) return els.dayErr.style.display = 'block';
        const newDate = new Date(d);
        newDate.setDate(d.getDate() + days);
        els.res.innerHTML = `<div>${fmt(newDate)}</div>`;
        els.resDet.innerHTML = `<div>（有效期至，从 ${fmt(d)} 起算 ${days} 天）</div>`;
    };
    
    const setToday = () => { 
        const now = new Date(); 
        els.sDate.value = fmt(now); 
        els.sPicker.value = fmt(now, '-'); 
        if (els.days.value) calc(); 
    };

    const adjustDate = (offset) => {
        const current = parse(els.sDate.value);
        if (current) {
            current.setDate(current.getDate() + offset);
            els.sDate.value = fmt(current);
            els.sPicker.value = fmt(current, '-');
            if (els.days.value) calc();
        } else {
            els.dErr.style.display = 'block';
        }
    };

    setToday();
    
    els.today.addEventListener('click', setToday);
    els.prevDayBtn.addEventListener('click', () => adjustDate(-1));
    els.nextDayBtn.addEventListener('click', () => adjustDate(1));
    
    els.qBtns.forEach(btn => btn.addEventListener('click', function() { 
        clearQuick(); 
        this.classList.add('active'); 
        els.days.value = this.dataset.days; 
        calc(); 
    }));
    
    els.sPicker.addEventListener('change', function() { 
        els.sDate.value = fmt(new Date(this.value)); 
        if (els.days.value) calc(); 
    });
    
    els.sDate.addEventListener('change', function() { 
        const d = parse(this.value); 
        if (d) {
            els.sPicker.value = fmt(d, '-'); 
            if (els.days.value) calc(); 
        } else if (this.value === '') {
            els.res.innerText = '请输入入境日期和停留天数';
            els.resDet.innerText = '';
            els.dErr.style.display = 'none';
        }
    });

    els.days.addEventListener('input', function() {
        clearQuick();
        if (this.value === '') {
            els.res.innerText = '请输入入境日期和停留天数';
            els.resDet.innerText = '';
            els.dayErr.style.display = 'none';
        } else {
            calc();
        }
    });

    els.calcBtn.addEventListener('click', () => { clearQuick(); calc(); });

    // ======== 全球免签政策速查逻辑 (169国数据) ========
    const urlMap = {
        1: 'https://www.mfa.gov.cn/wjbzwfwpt/kzx/tzgg/202504/t20250414_11594222.html',
        2: 'https://www.nia.gov.cn/n741440/n741577/c1731154/content.html'

                navigator.clipboard.writeText(url).then(() => {
                    const original = this.innerText;
                    this.innerText = '已复制！';
                    setTimeout(() => { this.innerText = original; }, 2000);
                });
            });
        });
    };

    const renderList = list => {
        if (!list.length) return els.cRes.innerHTML = '<div class="country-results-header">未找到相关国家政策</div>';
        const html = list.map(c => `
            <div class="country-item" data-code="${c.code}">
                <span class="country-name">${c.name}</span>
                <span class="country-code">${c.code}</span>
            </div>`).join('');
        els.cRes.innerHTML = html;

        els.cRes.querySelectorAll('.country-item').forEach(item => {
            item.addEventListener('click', function() {
                const code = this.dataset.code;
                const target = allCountries.find(c => c.code === code);
                if (target) renderCard(target);
            });
        });
    };

    const searchCountries = (term, forceList = false) => {
        if (!term) {
            els.cRes.innerHTML = '<div class="country-results-header">请输入国家名称或代码进行搜索</div>';
            return;
        }

        // 优先精确匹配
        if (!forceList) {
            const exactMatch = allCountries.find(c => c.name === term || c.code.toLowerCase() === term);
            if (exactMatch) {
                renderCard(exactMatch);
                return;
            }
        }

        // 模糊搜索
        const filtered = allCountries.filter(c => c.name.includes(term) || c.code.toLowerCase().includes(term));
        renderList(filtered);
    };

    els.search.addEventListener('input', e => searchCountries(e.target.value.trim().toLowerCase()));
    els.sBtn.addEventListener('click', () => searchCountries(els.search.value.trim().toLowerCase()));
    els.search.addEventListener('keypress', e => e.key === 'Enter' && searchCountries(els.search.value.trim().toLowerCase()));

    // ======== 右侧 AI 逻辑 ========
    const aiTabs = document.querySelectorAll('.ai-tab');
    const chatWindow = $('chatWindow');
    const aiInput = $('aiInput');
    const aiSendBtn = $('aiSendBtn');
    
    let currentAction = 'pronunciation'; 

    const updatePlaceholder = (action) => {
        if(action === 'pronunciation') aiInput.placeholder = "输入外宾姓名，例如：Schmidt";
        else if (action === 'short_translation') aiInput.placeholder = "输入短语（限中6字/英8词）";
        else aiInput.placeholder = "输入长文（限中100字/英200词）";
    }

    aiTabs.forEach(tab => {
        tab.addEventListener('click', () => {
            aiTabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            currentAction = tab.dataset.action;
            updatePlaceholder(currentAction);
            aiInput.value = '';
            chatWindow.innerHTML = '';
        });
    });

    const appendMessage = (text, sender, isLoading = false, type = 'normal') => {
        const row = document.createElement('div');
        row.className = `msg-row ${sender === 'ai' && type === 'adv' ? 'ai-adv' : sender}`;
        const bubble = document.createElement('div');
        bubble.className = 'msg-bubble';
        
        if (isLoading) {
            bubble.classList.add('loading-bubble');
            bubble.innerHTML = `
                <div class="typing-indicator">
                    <span></span><span></span><span></span>
                </div>`;
        } else {
            bubble.innerText = text; 
        }
        
        row.appendChild(bubble);
        chatWindow.appendChild(row);
        chatWindow.scrollTop = chatWindow.scrollHeight; 
        return bubble; 
    };

    const preValidate = (action, text) => {
        if (!text) return { valid: false, msg: null }; 

        const hasChinese = /[\u4e00-\u9fa5]/.test(text);
        const hasEnglish = /[a-zA-Z]/.test(text);

        if (action === 'short_translation' || action === 'long_translation') {
            if (hasChinese && hasEnglish) return { valid: false, msg: "请单独输入中文或英文" };
            
            if (action === 'short_translation') {
                if (hasChinese && text.replace(/[^\u4e00-\u9fa5]/g, "").length > 6) return { valid: false, msg: "提示字数超出短语上限（中文限6字）" };
                if (!hasChinese && text.trim().split(/\s+/).length > 8) return { valid: false, msg: "提示字数超出短语上限（英文限8词）" };
            } else {
                if (hasChinese && text.replace(/[^\u4e00-\u9fa5]/g, "").length > 100) return { valid: false, msg: "提示字数超出长文上限（中文限100字）" };
                if (!hasChinese && text.trim().split(/\s+/).length > 200) return { valid: false, msg: "提示字数超出长文上限（英文限200词）" };
            }
        }
        return { valid: true };
    };

    const handleSend = async () => {
        const text = aiInput.value.trim();

        if (!text) return;

        const validationResult = preValidate(currentAction, text);
        if (!validationResult.valid && validationResult.msg) {
            chatWindow.innerHTML = ''; 
            appendMessage(validationResult.msg, 'ai'); 
            return; 
        }

        chatWindow.innerHTML = '';
        appendMessage(text, 'user');
        aiInput.value = '';
        aiInput.focus();
        
        aiSendBtn.disabled = true;
        aiInput.disabled = true;
        let aiBubble = appendMessage('', 'ai', true); 

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: currentAction, text: text })
            });

            if (!response.ok) {
                aiBubble.innerHTML = ''; 
                aiBubble.classList.remove('loading-bubble');
                aiBubble.innerText = "抱歉，请求失败，请稍后再试。";
                aiBubble.style.color = "var(--err)";
                return; 
            }
            
            const reader = response.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let done = false;
            let buffer = ""; 
            let hasSplit = false; 
            
            let isFirstChunk = true; 

            while (!done) {
                const { value, done: readerDone } = await reader.read();
                done = readerDone;
                if (value) {
                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');
                    for (const line of lines) {
                        if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                            try {
                                const parsed = JSON.parse(line.slice(6));
                                const delta = parsed.choices[0].delta.content;
                                
                                if (delta) {
                                    if (isFirstChunk) {
                                        aiBubble.innerHTML = ''; 
                                        aiBubble.classList.remove('loading-bubble');
                                        isFirstChunk = false;
                                    }

                                    if (currentAction === 'pronunciation' && !hasSplit) {
                                        buffer += delta;
                                        if (buffer.includes('|||')) {
                                            hasSplit = true;
                                            const parts = buffer.split('|||');
                                            aiBubble.innerText = parts[0].trim(); 
                                            // 创建进阶气泡
                                            aiBubble = appendMessage(parts[1].trimStart(), 'ai', false, 'adv');
                                        } else {
                                            aiBubble.innerText += delta;
                                        }
                                    } else {
                                        aiBubble.innerText += delta;
                                    }
                                    chatWindow.scrollTop = chatWindow.scrollHeight; 
                                }
                            } catch (e) {}
                        }
                    }
                }
            }

        } catch (error) {
            aiBubble.innerHTML = ''; 
            aiBubble.classList.remove('loading-bubble');
            aiBubble.innerText = "网络请求异常，请检查连接或稍后再试。";
            aiBubble.style.color = "var(--err)";
        } finally {
            aiSendBtn.disabled = false;
            aiInput.disabled = false;
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }
    };

    aiSendBtn.addEventListener('click', handleSend);
    aiInput.addEventListener('keypress', e => e.key === 'Enter' && handleSend());
});
</script>
</body>
</html>
